frr defaults traditional
hostname r7
log file /var/log/frr/frr.log
!

! Interfaces
interface eth0
 ip address 172.16.77.46/30
 ip ospf cost 10
!
interface eth1
 ip address 172.16.77.53/30
 ip ospf cost 10
!

! Protocolos de ruteo
router ospf
 ospf router-id 7.7.7.7
 network 172.16.77.44/30 area 0.0.0.0
 network 172.16.77.52/30 area 0.0.0.0
!
line vty
!
