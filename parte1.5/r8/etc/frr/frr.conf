frr defaults traditional
hostname r8
log file /var/log/frr/frr.log
!

! Interfaces
interface eth0
 ip address 172.16.77.50/30
 ip ospf cost 10
!
interface eth1
 ip address 172.16.77.54/30
 ip ospf cost 10
!
interface eth2
 ip address 203.0.113.65/28
!

! Protocolos de ruteo
router ospf
 ospf router-id 8.8.8.8
 network 172.16.77.48/30 area 0.0.0.0
 network 172.16.77.52/30 area 0.0.0.0
 network 203.0.113.64/28 area 0.0.0.0
 passive-interface eth2
!
line vty
!
