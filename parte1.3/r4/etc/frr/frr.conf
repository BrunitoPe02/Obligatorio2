frr defaults traditional
hostname r4
log file /var/log/frr/frr.log
!

! Interfaces
interface eth0
 ip address 172.16.77.22/30
 ip ospf cost 10
!
interface eth1
 ip address 172.16.77.33/30
 ip ospf cost 10
!
interface eth2
 ip address 172.16.77.37/30
 ip ospf cost 10
!

! Protocolos de ruteo 
router ospf
 ospf router-id 4.4.4.4
 network 172.16.77.20/30 area 0.0.0.0
 network 172.16.77.32/30 area 0.0.0.0
 network 172.16.77.36/30 area 0.0.0.0
!
line vty
!