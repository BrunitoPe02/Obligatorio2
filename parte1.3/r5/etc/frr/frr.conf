frr defaults traditional
hostname r5
log file /var/log/frr/frr.log
!

! Interfaces
interface eth0
 ip address 172.16.77.26/30
 ip ospf cost 10
!
interface eth1
 ip address 172.16.77.30/30
 ip ospf cost 10
!
interface eth2
 ip address 172.16.77.34/30
 ip ospf cost 10
!
interface eth3
 ip address 172.16.77.41/30
 ip ospf cost 10
!
interface eth4
 ip address 192.168.77.5/30
!

! Rutas estáticas (Cliente B no habla OSPF)
ip route 203.0.113.32/28 192.168.77.6
!

! Protocolos de ruteo
router ospf
 ospf router-id 5.5.5.5
 network 172.16.77.24/30 area 0.0.0.0
 network 172.16.77.28/30 area 0.0.0.0
 network 172.16.77.32/30 area 0.0.0.0
 network 172.16.77.40/30 area 0.0.0.0
 redistribute static
!
line vty
!
