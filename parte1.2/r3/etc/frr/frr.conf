frr defaults traditional
hostname r3
log file /var/log/frr/frr.log
!

! Interfaces
interface eth0
 ip address 172.16.77.14/30
!
interface eth1
 ip address 172.16.77.18/30
!
interface eth2
 ip address 172.16.77.29/30
!
interface eth3
 ip address 192.168.77.1/30
!
ip route 203.0.113.0/27 192.168.77.2
!

! Protocolos de ruteo 
router ospf
 ospf router-id 3.3.3.3
 network 172.16.77.12/30 area 0.0.0.0
 network 172.16.77.16/30 area 0.0.0.0
 network 172.16.77.28/30 area 0.0.0.0
 redistribute static
!
line vty
!