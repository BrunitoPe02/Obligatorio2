frr defaults traditional
hostname r1
log file /var/log/frr/frr.log
!

! Interfaces
! entro a configurar la interfaz eth0
interface eth0
!Esta interfaz tiene la IP 172.16.77.2, con máscara /30
 ip address 172.16.77.2/30  
!
interface eth1
 ip address 172.16.77.9/30
 ip ospf cost 10
!
interface eth2
 ip address 172.16.77.13/30
 ip ospf cost 10
!

! Rutas estáticas (rint no habla OSPF)
! "para llegar a 8.8.8.0/24, dáselo a rint (172.16.77.1)"
ip route 8.8.8.0/24 172.16.77.1
!

! Protocolos de ruteo 
router ospf
 ospf router-id 1.1.1.1
    network 172.16.77.8/30 area 0.0.0.0
    network 172.16.77.12/30 area 0.0.0.0
    redistribute static
!
line vty
!
