frr defaults traditional
hostname r2
log file /var/log/frr/frr.log
!

! Interfaces

interface eth0
 ip address 172.16.77.10/30  
!
interface eth1
 ip address 172.16.77.17/30
!
interface eth2
 ip address 172.16.77.21/30
!
interface eth3
 ip address 172.16.77.25/30
!

! Protocolos de ruteo 
router ospf
 ospf router-id 2.2.2.2
    network 172.16.77.8/30 area 0.0.0.0
    network 172.16.77.16/30 area 0.0.0.0
    network 172.16.77.20/30 area 0.0.0.0
    network 172.16.77.24/30 area 0.0.0.0
    redistribute static
!
line vty
!