frr defaults traditional
hostname r6
log file /var/log/frr/frr.log
!

! Interfaces
interface eth0
 ip address 172.16.77.6/30
!
interface eth1
 ip address 172.16.77.38/30
 ip ospf cost 10
!
interface eth2
 ip address 172.16.77.42/30
 ip ospf cost 10
!

interface eth3
 ip address 172.16.77.49/30
 ip ospf cost 10
!

! Rutas estáticas (rint no habla OSPF)
ip route 8.8.8.0/24 172.16.77.5
!

! Protocolos de ruteo
router ospf
 ospf router-id 6.6.6.6
 network 172.16.77.36/30 area 0.0.0.0
 network 172.16.77.40/30 area 0.0.0.0
 network 172.16.77.48/30 area 0.0.0.0
 redistribute static
!
line vty
!
